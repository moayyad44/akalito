<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>أكليتو — السائق</title>
<link rel="manifest" href="manifest-driver.json">
<meta name="theme-color" content="#A23E48">
<link rel="apple-touch-icon" href="icons/driver-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سائق أكليتو">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary:#A23E48; --secondary:#F5A65B; --bg:#FDF8F3; --surface:#FFFFFE; --border:#EBE0D3; --text:#3A2A28; --text30:#9C8C82; }
  * { box-sizing: border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overflow-x: hidden; }
  body { font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); direction:rtl; min-height:100vh; overflow-x:hidden; }
  h1,h2,h3 { font-family:'Tajawal',sans-serif; }
  button { font-family:inherit; cursor:pointer; }

  #welcomeScreen { display:flex; flex-direction:column; justify-content:center; min-height:100vh; padding:28px; text-align:center; }
  #welcomeScreen h1 { font-size:26px; color:var(--primary); margin-bottom:6px; }
  #welcomeScreen p { color:var(--text30); font-size:14px; margin-bottom:28px; }
  .field-group { text-align:right; margin-bottom:14px; }
  .field-group label { font-size:13px; font-weight:600; display:block; margin-bottom:6px; }
  .field-group input {
    width:100%; padding:13px 16px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--surface); font-family:inherit; font-size:15px; color:var(--text);
  }
  .field-group input:focus { outline:none; border-color:var(--primary); }
  .btn-main {
    width:100%; padding:15px; border-radius:14px; border:none; background:var(--primary);
    color:#fff; font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-main:disabled { opacity:.5; }
  .btn-ghost {
    width:100%; padding:14px; border-radius:14px; border:1.5px solid var(--border); background:transparent;
    color:var(--text); font-weight:600; font-size:14px; margin-top:12px;
  }
  .error-text { color:var(--primary); font-size:12.5px; margin-top:10px; display:none; }
  .divider { display:flex; align-items:center; gap:10px; color:var(--text30); font-size:12px; margin:22px 0; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }

  .status-card { display:none; text-align:center; padding:20px; border-radius:16px; background:var(--surface); border:1.5px solid var(--border); margin-top:6px; }
  .status-card .emoji { font-size:40px; margin-bottom:10px; }
  .status-card .title { font-weight:800; font-size:16px; margin-bottom:6px; }
  .status-card .desc { color:var(--text30); font-size:13px; line-height:1.7; margin-bottom:16px; }
</style>
</head>
<body>

<div id="welcomeScreen">
  <div class="logo-mark" style="margin-bottom:8px;">
    <svg viewBox="0 0 48 48" width="60" height="60" aria-hidden="true">
      <circle cx="24" cy="24" r="24" fill="#A23E48"/>
      <circle cx="15" cy="32" r="3.2" stroke="#FDF8F3" stroke-width="2" fill="none"/>
      <circle cx="33" cy="32" r="3.2" stroke="#FDF8F3" stroke-width="2" fill="none"/>
      <path d="M15 32h8l4-9h6" stroke="#FDF8F3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19 23h6" stroke="#FDF8F3" stroke-width="2" stroke-linecap="round"/>
      <path d="M29 23h4" stroke="#FDF8F3" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>أكليتو للسائقين</h1>
  <p id="welcomeSub">سجّل دخولك برقم هاتفك عشان تبدأ تستلم طلبات التوصيل</p>

  <div id="loginBox">
    <div class="field-group">
      <label>رقم الهاتف</label>
      <input type="tel" id="w-phone" placeholder="مثال: 0791234567">
    </div>

    <button class="btn-main" id="w-start-btn" onclick="loginDriver()">دخول 🚀</button>
    <div class="error-text" id="w-error"></div>

    <div class="divider">أو</div>
    <button class="btn-ghost" onclick="window.location.href='akleto-driver-signup.html'">ما عندي حساب — سجّل كسائق جديد</button>
  </div>

  <div class="status-card" id="statusCard">
    <div class="emoji" id="statusEmoji">⏳</div>
    <div class="title" id="statusTitle"></div>
    <div class="desc" id="statusDesc"></div>
    <button class="btn-ghost" onclick="resetLogin()">رجوع</button>
  </div>
</div>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
}
</script>
<script type="module">
import { getDriverSession, saveDriverSession, findDriverByPhone } from "./driver-shared.js";

window.resetLogin = () => {
  document.getElementById('statusCard').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
};

function showStatus(emoji, title, desc) {
  document.getElementById('loginBox').style.display = 'none';
  const card = document.getElementById('statusCard');
  document.getElementById('statusEmoji').textContent = emoji;
  document.getElementById('statusTitle').textContent = title;
  document.getElementById('statusDesc').textContent = desc;
  card.style.display = 'block';
}

window.loginDriver = async () => {
  const phone = document.getElementById('w-phone').value.trim();
  const errBox = document.getElementById('w-error');
  errBox.style.display = 'none';

  if (!/^0\d{8,9}$/.test(phone)) {
    errBox.textContent = 'رقم الهاتف غير صحيح (مثال: 0791234567)';
    errBox.style.display = 'block';
    return;
  }

  const btn = document.getElementById('w-start-btn');
  btn.disabled = true;
  btn.textContent = 'جاري التحقق...';

  try {
    const driver = await findDriverByPhone(phone);

    if (!driver) {
      showStatus('🤔', 'ما لقينا حساب بهاد الرقم', 'تأكد من الرقم، أو سجّل كسائق جديد من الصفحة الرئيسية.');
      return;
    }
    if (driver.approval_status === 'rejected') {
      showStatus('🚫', 'طلبك ما تم قبوله', 'للاستفسار تواصل معنا مباشرة.');
      return;
    }
    if (driver.approval_status === 'pending') {
      showStatus('⏳', 'حسابك قيد المراجعة', 'رح نتحقق من بياناتك وصورك ونوافق عليك بأقرب وقت. جرب ترجع تسجل دخول بعد فترة.');
      return;
    }
    if (driver.is_active === false) {
      showStatus('⛔', 'حسابك موقوف حالياً', 'للاستفسار عن سبب الإيقاف تواصل معنا مباشرة.');
      return;
    }

    saveDriverSession(driver.id, driver.name, driver.phone);
    window.location.href = 'akleto-driver-home.html';
  } catch (e) {
    console.error('driver login error', e);
    errBox.textContent = 'صار خطأ — جرب مرة ثانية';
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'دخول 🚀';
  }
};

window.addEventListener('DOMContentLoaded', () => {
  if (getDriverSession()) window.location.href = 'akleto-driver-home.html';
});
</script>
</body>
</html>
